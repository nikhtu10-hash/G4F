name: g4f Provider Health Check

on:
  schedule:
    # 3x/day, UTC. Adjust to your timezone preference.
    - cron: '0 0 * * *'   # 00:00 UTC
    - cron: '0 8 * * *'   # 08:00 UTC
    - cron: '0 16 * * *'  # 16:00 UTC
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: g4f-provider-health-check
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'   # make sure logs stream live instead of buffering
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          echo "::group::Installing ffmpeg (needed by some audio-capable providers)"
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          echo "::endgroup::"

      - name: Install dependencies
        run: |
          echo "::group::Installing g4f and dependencies"
          echo "Getting ready: upgrading pip..."
          python -m pip install --upgrade pip
          echo "Installing requirements from requirements.txt (this includes g4f[all], can take a minute)..."
          pip install -r requirements.txt
          echo "Dependencies installed."
          echo "::endgroup::"

      - name: Run provider/model tests
        env:
          G4F_TEST_TIMEOUT: '25'
          G4F_TEST_CONCURRENCY: '8'
          G4F_MAX_MODELS_PER_PROVIDER: '6'
        run: python scripts/test_providers.py

      - name: Generate txt/html report
        run: |
          echo "::group::Generating results.txt and index.html"
          python scripts/generate_report.py
          echo "::endgroup::"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update g4f provider health report [skip ci]"
            git pull --rebase
            git push
          fi
