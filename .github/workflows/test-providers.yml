name: g4f Provider Health Check

on:
  schedule:
    # 3x/day, UTC. Adjust to your timezone preference.
    - cron: '0 0 * * *'   # 00:00 UTC
    - cron: '0 8 * * *'   # 08:00 UTC
    - cron: '0 16 * * *'  # 16:00 UTC
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: g4f-provider-health-check
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Testing chat + image + audio (every voice) + video + transcription across
    # every provider takes a lot longer than chat alone. The script saves
    # results.json incrementally, so even a run that hits this ceiling still
    # produces a usable partial report - see "Generate txt/html report" below.
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'   # make sure logs stream live instead of buffering
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg
        run: |
          echo "::group::Installing ffmpeg (needed by some audio-capable providers)"
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          echo "::endgroup::"

      # Several g4f providers automate a real, throwaway browser (nodriver /
      # webdriver / playwright) instead of talking to a plain HTTP API.
      # Without an actual Chromium binary installed, every one of those
      # providers just fails outright - which is the #1 reason "browser
      # required" providers used to show up as broken in this report even
      # when they were actually fine. Installing a real browser + a virtual
      # display (xvfb) lets the test step drive them for real.
      #
      # Note: providers that need a HAR file / exported cookies from a real,
      # already-logged-in human session are a *different* category - no
      # amount of browser automation can produce a valid login from scratch,
      # so the test script deliberately skips those with a clear reason
      # instead of wasting the run's time budget on a guaranteed failure.
      - name: Install Chromium (for browser-automation providers)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Xvfb (virtual display for headless browser automation)
        run: sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          echo "::group::Installing g4f and dependencies"
          echo "Getting ready: upgrading pip..."
          python -m pip install --upgrade pip
          echo "Installing requirements from requirements.txt (this includes g4f[all], can take a minute)..."
          pip install -r requirements.txt
          echo "Dependencies installed."
          echo "::endgroup::"

      - name: Run provider/model tests
        env:
          # Chat
          G4F_TEST_TIMEOUT: '25'
          # Image generation (every model = every style variant a provider lists)
          G4F_IMAGE_TIMEOUT: '60'
          # Audio / text-to-speech (every voice a model lists, capped below)
          G4F_AUDIO_TIMEOUT: '45'
          G4F_MAX_VOICES_PER_MODEL: '8'
          # Video generation - slow and rare, so a separate low concurrency
          G4F_VIDEO_TIMEOUT: '180'
          G4F_VIDEO_CONCURRENCY: '2'
          # Transcription (speech-to-text)
          G4F_TRANSCRIPTION_TIMEOUT: '45'
          # General
          G4F_TEST_CONCURRENCY: '8'
          G4F_MAX_MODELS_PER_PROVIDER: '6'
          G4F_SAVE_EVERY: '15'
          # Best-effort hints for browser-automation providers to find the
          # Chromium binary installed above. g4f may or may not read these
          # depending on version - harmless either way.
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        # continue-on-error lets the later "always()" steps below still run
        # (and commit whatever partial results.json exists) even if this
        # step ultimately exits non-zero - e.g. because it was still running
        # when the job's timeout-minutes ceiling hit.
        continue-on-error: true
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scripts/test_providers.py

      - name: Generate txt/html report
        if: always()
        run: |
          echo "::group::Generating results.txt and index.html"
          python scripts/generate_report.py
          echo "::endgroup::"

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update g4f provider health report [skip ci]"
            git pull --rebase
            git push
          fi
